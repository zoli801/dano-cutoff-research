[project]
name = "dano-cutoff-research"
version = "0.1.0"
description = "Auditable local research on DANO qualification cutoffs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4", "requests", "pandas", "numpy", "scipy", "scikit-learn",
  "catboost", "lightgbm", "matplotlib", "seaborn", "pymupdf", "openpyxl",
  "torch", "transformers<5", "huggingface-hub", "safetensors", "pytest", "joblib"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
